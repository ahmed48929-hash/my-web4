<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>حساب عزم القوة</title>
<style>
:root{--bg:#f6f4fb;--card:#fff;--tx:#1f1b2d;--mu:#625c75;--pr:#6b2f8a;--ok:#17803d;--bad:#b3261e;--bd:#ddd6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#17141f;--card:#221e2e;--tx:#f1eef8;--mu:#b3abc6;--pr:#c58be6;--ok:#5fd18a;--bad:#ff8a80;--bd:#3b3550}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:17px/1.8 "Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg)}
header{position:sticky;top:0;background:var(--pr);color:#fff;padding:10px 14px;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:16px}#bar{height:5px;background:rgba(255,255,255,.3)}#bar i{display:block;height:100%;width:0;background:#fff;transition:width .3s}
main{max-width:760px;margin:0 auto;padding:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
h2{margin:6px 0;color:var(--pr);font-size:21px}img{max-width:100%;height:auto;border-radius:8px;display:block;margin:auto;background:#fff}.cap{text-align:center;color:var(--mu);font-size:14px}
button{font:inherit;border:1px solid var(--pr);background:transparent;color:var(--pr);border-radius:10px;padding:8px 14px;margin:4px;cursor:pointer}button.p{background:var(--pr);color:#fff}button:disabled{opacity:.4}
input,textarea{font:inherit;width:100%;border:1px solid var(--bd);border-radius:10px;padding:8px;background:var(--bg);color:var(--tx);margin:4px 0}input.n{width:130px;direction:ltr;text-align:center}
.fb{margin-top:8px;font-weight:600}.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}.sol{background:var(--bg);border-radius:10px;padding:8px;margin-top:8px}
.w{position:relative}.hs{position:absolute;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px solid var(--pr);background:rgba(107,47,138,.18);padding:0}.hs.d{background:rgba(23,128,61,.35);border-color:var(--ok)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px;border-bottom:1px dashed var(--bd);padding:4px 0}.row span{flex:1 1 220px}.sel{background:var(--pr);color:#fff}
nav{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:8px 14px calc(6px + env(safe-area-inset-bottom,0px))}.nr{display:flex;justify-content:space-between}nav small{display:block;text-align:center;font-size:11px;color:var(--mu);line-height:1.4;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0;padding:14px 6px;background:var(--card);height:100%;text-align:center}.tile.seen{border-color:var(--ok);border-width:2px}.ic{font-size:32px;line-height:1.3}.eq{display:inline-block;white-space:nowrap;unicode-bidi:isolate;direction:ltr}</style></head><body>
